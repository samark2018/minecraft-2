<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft - HTML Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background: #1a1a1a;
        }

        #gameContainer {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #gameView {
            flex: 1;
            position: relative;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%);
            overflow: hidden;
        }

        #world {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .block {
            position: absolute;
            border: 1px solid rgba(0, 0, 0, 0.2);
        }

        .grass {
            background: linear-gradient(135deg, #7cb342 0%, #9ccc65 100%);
        }

        .dirt {
            background: linear-gradient(135deg, #8d6e63 0%, #a1887f 100%);
        }

        .stone {
            background: linear-gradient(135deg, #9e9e9e 0%, #bdbdbd 100%);
        }

        .wood {
            background: linear-gradient(135deg, #795548 0%, #a1887f 100%);
        }

        .water {
            background: linear-gradient(135deg, #1e88e5 0%, #42a5f5 100%);
            opacity: 0.8;
        }

        #player {
            position: absolute;
            width: 30px;
            height: 40px;
            background: linear-gradient(135deg, #ffcc99 0%, #ffb74d 100%);
            border: 2px solid #333;
            left: 50%;
            bottom: 180px;
            transform: translateX(-50%);
            z-index: 100;
            border-radius: 2px;
        }

        #player::before {
            content: '';
            position: absolute;
            width: 26px;
            height: 12px;
            background: #cc7722;
            top: -12px;
            left: 2px;
            border-radius: 2px;
        }

        #player::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 2px;
            background: #333;
            top: 50%;
            left: 0;
        }

        #hud {
            padding: 20px;
            color: white;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #inventory {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 5px;
            align-items: center;
        }

        .inventory-slot {
            width: 40px;
            height: 40px;
            background: rgba(100, 100, 100, 0.7);
            border: 2px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 12px;
            color: white;
            font-weight: bold;
            transition: all 0.1s;
        }

        .inventory-slot:hover {
            background: rgba(150, 150, 150, 0.9);
        }

        .inventory-slot.selected {
            border: 2px solid #ffff00;
            background: rgba(150, 150, 150, 0.9);
        }

        .inventory-slot.block-grass {
            background: linear-gradient(135deg, #7cb342 0%, #9ccc65 100%);
        }

        .inventory-slot.block-dirt {
            background: linear-gradient(135deg, #8d6e63 0%, #a1887f 100%);
        }

        .inventory-slot.block-stone {
            background: linear-gradient(135deg, #9e9e9e 0%, #bdbdbd 100%);
        }

        .inventory-slot.block-wood {
            background: linear-gradient(135deg, #795548 0%, #a1887f 100%);
        }

        .inventory-slot.block-water {
            background: linear-gradient(135deg, #1e88e5 0%, #42a5f5 100%);
        }

        #stats {
            display: flex;
            gap: 20px;
        }

        #instructions {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #ffff00;
            padding: 15px;
            border-radius: 5px;
            font-size: 12px;
            line-height: 1.6;
            z-index: 50;
            max-width: 250px;
        }

        #instructions h3 {
            margin-bottom: 10px;
            color: #00ff00;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="gameView">
            <div id="world"></div>
            <div id="player"></div>
            <div id="instructions">
                <h3>Minecraft HTML</h3>
                <p><strong>WASD</strong> - Move</p>
                <p><strong>SPACE</strong> - Jump</p>
                <p><strong>Click</strong> - Place Block</p>
                <p><strong>1-9</strong> - Select Block</p>
            </div>
        </div>
        <div id="hud">
            <div id="stats">
                <div>Position: <span id="posX">0</span>, <span id="posY">0</span></div>
                <div>Selected: <span id="selectedBlock">Grass</span></div>
            </div>
            <div id="inventory"></div>
        </div>
    </div>

    <script>
        const BLOCK_SIZE = 50;
        const WORLD_WIDTH = 30;
        const WORLD_HEIGHT = 20;
        const GRAVITY = 0.6;
        const JUMP_STRENGTH = 15;

        let gameState = {
            playerX: WORLD_WIDTH / 2,
            playerY: 5,
            playerVelY: 0,
            isJumping: false,
            selectedBlock: 'grass',
            blocks: {}
        };

        const blockTypes = {
            grass: { color: 'grass', name: 'Grass' },
            dirt: { color: 'dirt', name: 'Dirt' },
            stone: { color: 'stone', name: 'Stone' },
            wood: { color: 'wood', name: 'Wood' },
            water: { color: 'water', name: 'Water' }
        };

        const keys = {};
        const gameView = document.getElementById('gameView');
        const world = document.getElementById('world');
        const player = document.getElementById('player');
        const inventory = document.getElementById('inventory');

        // Generate initial world
        function generateWorld() {
            gameState.blocks = {};
            
            // Create ground
            for (let x = 0; x < WORLD_WIDTH; x++) {
                for (let y = WORLD_HEIGHT - 5; y < WORLD_HEIGHT; y++) {
                    const blockType = y === WORLD_HEIGHT - 5 ? 'grass' : 'dirt';
                    gameState.blocks[`${x},${y}`] = blockType;
                }
            }

            // Add some random blocks
            for (let i = 0; i < 20; i++) {
                const x = Math.floor(Math.random() * WORLD_WIDTH);
                const y = Math.floor(Math.random() * (WORLD_HEIGHT - 6)) + 2;
                gameState.blocks[`${x},${y}`] = 'stone';
            }

            // Add trees
            for (let i = 0; i < 5; i++) {
                const x = Math.floor(Math.random() * WORLD_WIDTH);
                const y = WORLD_HEIGHT - 6;
                gameState.blocks[`${x},${y}`] = 'wood';
                gameState.blocks[`${x},${y - 1}`] = 'wood';
                gameState.blocks[`${x},${y - 2}`] = 'wood';
            }
        }

        // Render world
        function renderWorld() {
            world.innerHTML = '';
            for (const [key, blockType] of Object.entries(gameState.blocks)) {
                const [x, y] = key.split(',').map(Number);
                const block = document.createElement('div');
                block.className = `block ${blockTypes[blockType].color}`;
                block.style.left = (x * BLOCK_SIZE) + 'px';
                block.style.top = (y * BLOCK_SIZE) + 'px';
                block.style.width = BLOCK_SIZE + 'px';
                block.style.height = BLOCK_SIZE + 'px';
                world.appendChild(block);
            }
        }

        // Update player position
        function updatePlayer() {
            // Apply gravity
            gameState.playerVelY += GRAVITY;
            gameState.playerY += gameState.playerVelY;

            // Movement
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
                gameState.playerX -= 0.3;
            }
            if (keys['ArrowRight'] || keys['d'] || keys['D']) {
                gameState.playerX += 0.3;
            }

            // Check collision with blocks
            const playerGridX = Math.round(gameState.playerX);
            const playerGridY = Math.round(gameState.playerY);

            // Ground collision
            for (let y = playerGridY; y < playerGridY + 2; y++) {
                if (gameState.blocks[`${playerGridX},${y}`]) {
                    gameState.playerY = y - 1;
                    gameState.playerVelY = 0;
                    gameState.isJumping = false;
                }
            }

            // Jump
            if ((keys[' '] || keys['w'] || keys['W']) && !gameState.isJumping) {
                gameState.playerVelY = -JUMP_STRENGTH;
                gameState.isJumping = true;
            }

            // Boundaries
            gameState.playerX = Math.max(0, Math.min(WORLD_WIDTH - 0.6, gameState.playerX));
            if (gameState.playerY > WORLD_HEIGHT) {
                gameState.playerY = 5;
                gameState.playerVelY = 0;
            }

            // Render player
            player.style.left = (gameState.playerX * BLOCK_SIZE + BLOCK_SIZE / 2) + 'px';
            player.style.bottom = ((WORLD_HEIGHT - gameState.playerY - 0.8) * BLOCK_SIZE) + 'px';

            // Update HUD
            document.getElementById('posX').textContent = Math.round(gameState.playerX);
            document.getElementById('posY').textContent = Math.round(gameState.playerY);
        }

        // Initialize inventory
        function initInventory() {
            inventory.innerHTML = '';
            const blockTypesList = Object.keys(blockTypes);
            blockTypesList.forEach((blockType, index) => {
                const slot = document.createElement('div');
                slot.className = `inventory-slot block-${blockType}`;
                if (blockType === gameState.selectedBlock) {
                    slot.classList.add('selected');
                }
                slot.textContent = index + 1;
                slot.onclick = () => selectBlock(blockType, slot);
                inventory.appendChild(slot);
            });
        }

        function selectBlock(blockType, slot) {
            gameState.selectedBlock = blockType;
            document.querySelectorAll('.inventory-slot').forEach(s => s.classList.remove('selected'));
            slot.classList.add('selected');
            document.getElementById('selectedBlock').textContent = blockTypes[blockType].name;
        }

        // Place block on click
        gameView.addEventListener('click', (e) => {
            const rect = gameView.getBoundingClientRect();
            const x = Math.floor((e.clientX - rect.left) / BLOCK_SIZE);
            const y = Math.floor((e.clientY - rect.top) / BLOCK_SIZE);
            
            if (x >= 0 && x < WORLD_WIDTH && y >= 0 && y < WORLD_HEIGHT) {
                gameState.blocks[`${x},${y}`] = gameState.selectedBlock;
            }
        });

        // Keyboard events
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            
            // Number keys for block selection
            const num = parseInt(e.key);
            if (num >= 1 && num <= 9) {
                const blockTypesList = Object.keys(blockTypes);
                if (num - 1 < blockTypesList.length) {
                    selectBlock(blockTypesList[num - 1], document.querySelectorAll('.inventory-slot')[num - 1]);
                }
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // Game loop
        function gameLoop() {
            renderWorld();
            updatePlayer();
            requestAnimationFrame(gameLoop);
        }

        // Initialize game
        generateWorld();
        initInventory();
        gameLoop();
    </script>
</body>
</html>
